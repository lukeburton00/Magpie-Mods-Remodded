PART
{
	name = StowPakSup
	module = Part
	author = RoverDude

	rescaleFactor = 1
	MODEL
	{
		model = UmbraSpaceIndustries/Kontainers/Assets/MiniPak
		scale = 1.5,1.5,1.5
	}

	// definition format is Position X, Position Y, Position Z, Up X, Up Y, Up Z
	node_attach = 0,0,.225,0,0,-1

	breakingForce = 2072
	breakingTorque = 2072

	TechRequired = advConstruction
	entryCost = 7600
	cost = 3800
	category = Payload
	subcategory = 0
	title = #LOC_USI_StowPakSup_title
	manufacturer = USI - Logistics Division
	description = #LOC_USI_StowPakSup_description

	attachRules = 1,1,1,1,0

	mass = 0.1
	dragModelType = default
	maximum_drag = 0.20
	minimum_drag = 0.15
	angularDrag = 2
	crashTolerance = 8
	maxTemp = 2000
	bulkheadProfiles = size1,srf

	MODULE:NEEDS[KIS]
	{
        name = ModuleKISItem
        shortcutKeyAction = drop
        useName = use
        usableFromEva = true
        usableFromContainer = true
        usableFromPod = true
        usableFromEditor = true
        stackable = false
        volumeOverride = 1000
        editorItemsCategory = false
        moveSndPath = KIS/Sounds/itemMove
        equipable = false
        equipMode = part
        equipSlot = Back Pocket
        equipSkill =
        equipRemoveHelmet = false
        equipMeshName = helmet
        equipBoneName = helmet01
        equipPos = (0, 0, 0)
        equipDir = (0, 0, 0)
        carriable = true
        allowAttachOnStatic = false
	}

	MODULE
	{
	    name = WBIConvertibleStorage
	    enableLogging = True

	    //Determines whether or not to show the context menu GUI
	    showGUI = True

	    //Short name of the default module template.
	    //This is used when selecting the part in the editor.
	    //User will then right-click on the module to change its type.
	    defaultTemplate = LFO

	    //name of the template nodes to use
	    templateNodes = STORAGE_TEMPLATE

	    //Determines if the module allows in-field reconfiguring
	    fieldReconfigurable = True

	    //Some containers don't hold as much resources as the template specifies, while others hold more.
	    //Since the resource templates specify base amounts, the capacity factor specifies a multiplier to
	    //factor into the resource amounts.
	    capacityFactor = 0.006
	
	    //Name of the logo panel transforms
	    logoPanelTransforms = logoPanel001, logoPanel002, logoPanel003, logoPanel004
	    decalsVisible = false

	    //If the part has a KIS container, this is the base and max amount
	    baseStorage = 200
	    maxStorage = 7500
	}
}
