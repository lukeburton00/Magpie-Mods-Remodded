	manufacturer = #autoLOC_6004000 //#autoLOC_6004000 = Stratus Corporation
	attachRules = 0,1,0,0,1
	mass = 0.03
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
