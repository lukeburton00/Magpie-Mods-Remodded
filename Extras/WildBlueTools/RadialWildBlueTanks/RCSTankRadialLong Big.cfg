	{
		model = Squad/Parts/RCSTanksRadialLong/model
	}
	rescaleFactor = 1.5
	node_attach = 0.0, 0.0, -0.3125, 0.0, 0.0, -1.0
	TechRequired = specializedControl
	entryCost = 5400
