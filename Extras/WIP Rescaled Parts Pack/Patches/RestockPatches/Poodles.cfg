  {
    cube = Fairing, 3.898,0.7731,1.901, 3.898,0.773,1.901, 3.297,0.7352,1.744, 3.311,0.6924,1.917, 3.895,0.7689,2.073, 3.895,0.7683,2.129, -0.001018,-0.6431,-0.002216, 3.418,1.717,3.42
