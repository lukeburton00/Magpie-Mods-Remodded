// Bicouplers
@PART[stackBiCoupler_v3m,stackBiCoupler_v187,stackBiCoupler_v062,stackBiCoupler_v3mF,stackBiCoupler_v187F,stackBiCoupler_v062F]:HAS[~RestockIgnore[*]]:FOR[ReStock]:NEEDS[ReStock]
{
  @author = Andrew Cassidy

  !MODEL {}
  MODEL
  {
    model = ReStock/Assets/Structural/restock-multicoupler-125-125-x2
  }

  // stock nodes are slightly off center and don't match the model
  // this shouldn't affect too much since nodes are saved for existing craft
  @node_stack_bottom1 = 0.625, -0.33838, 0.0, 0.0, -1.0, 0.0
  @node_stack_bottom2 = -0.625, -0.33838, 0.0, 0.0, -1.0, 0.0

  !MODULE[ModulePartVariants] {}
  MODULE
  {
    name = ModulePartVariants
    useMultipleDragCubes = false
    baseVariant = BlackAndWhite
    VARIANT
    {
      name = Dark
      displayName = #autoLOC_8007117
      themeName = Dark
      primaryColor = #4c4f47
      secondaryColor = #4c4f47
      GAMEOBJECTS
      {
        Bicoupler-BW = false
        Bicoupler-Dark = true
        Bicoupler-Orange = false
        Bicoupler-White = false
      }
    }
    VARIANT
    {
      name = BlackAndWhite
      displayName = #autoLOC_8007122
      themeName = BlackAndWhite
      primaryColor = #ffffff
      secondaryColor = #000000
      GAMEOBJECTS
      {
        Bicoupler-BW = true
        Bicoupler-Dark = false
        Bicoupler-Orange = false
        Bicoupler-White = false
      }
    }
    VARIANT
    {
      name = White
      displayName = #autoLOC_8007119
      themeName = White
      primaryColor = #ffffff
      secondaryColor = #ffffff
      GAMEOBJECTS
      {
        Bicoupler-BW = false
        Bicoupler-Dark = false
        Bicoupler-Orange = false
        Bicoupler-White = true
      }
    }
    VARIANT
    {
      name = Orange
      displayName = #autoLOC_8007121
      themeName = GrayAndOrange
      primaryColor = #4c4f47
      secondaryColor = #f49841
      GAMEOBJECTS
      {
        Bicoupler-BW = false
        Bicoupler-Dark = false
        Bicoupler-Orange = true
        Bicoupler-White = false
      }
    }
  }
}

