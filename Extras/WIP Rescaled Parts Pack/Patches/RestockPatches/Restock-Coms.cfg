// HG-5 High Gain Antenna
@PART[HighGainAntenna5bg,HighGainAntenna5bgr]:HAS[~RestockIgnore[*]]:FOR[ReStock]:NEEDS[ReStock]
{
  @author = Andrew Cassidy
  !MODEL {}
  MODEL
  {
    model = ReStock/Assets/Communication/restock-relay-radial-1
  }
  @MODULE[ModuleDeployableAntenna]
  {
    @animationName = Deploy
    @pivotName = lower pivot
  }
  MODULE
  {
    name = ModulePartVariants
    baseVariant = Radial
    VARIANT
    {
      name = Radial
      displayName = #LOC_Restock_variant-antenna_radial
      themeName = White
      primaryColor = #ffffff
      secondaryColor = #707070
      GAMEOBJECTS
      {
        arm_radial = true
        arm_radial_reverse = false
        arm_axial = false
        arm_axial_reverse = false
      }
    }
    VARIANT
    {
      name = Radial_Reverse
      displayName = #LOC_Restock_variant-antenna_radial_reverse
      themeName = White
      primaryColor = #ffffff
      secondaryColor = #707070
      GAMEOBJECTS
      {
        arm_radial = false
        arm_radial_reverse = true
        arm_axial = false
        arm_axial_reverse = false
      }
    }
    VARIANT
    {
      name = Axial
      displayName = #LOC_Restock_variant-antenna_axial
      themeName = White
      primaryColor = #ffffff
      secondaryColor = #707070
      GAMEOBJECTS
      {
        arm_radial = false
        arm_radial_reverse = false
        arm_axial = true
        arm_axial_reverse = false
      }
    }
    VARIANT
    {
      name = Axial_Reverse
      displayName = #LOC_Restock_variant-antenna_axial_reverse
      themeName = White
      primaryColor = #ffffff
      secondaryColor = #707070
      GAMEOBJECTS
      {
        arm_radial = false
        arm_radial_reverse = false
        arm_axial = false
        arm_axial_reverse = true
      }
    }
  }
}
