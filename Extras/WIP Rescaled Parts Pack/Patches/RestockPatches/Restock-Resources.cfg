// M700 Survey Scanner

@PART[SurveyScannerSmall]:HAS[~RestockIgnore[*]]:FOR[ReStock]:NEEDS[ReStock]
{
  @author = Andrew Cassidy

  !MODEL {}
  MODEL
  {
    model = ReStock/Assets/Resource/restock-surveyscanner-1
    scale = 1.0, 1.0, 1.0
  }

  @MODULE[ModuleAnimationGroup]
  {
    @deployAnimationName = Deploy
    deployEffectName = Deploy
    retractEffectName = Retract
  }

  EFFECTS
  {
    Deploy {
      AUDIO
      {
        channel = Ship
        clip = ReStock/Sounds/scanner-open
        volume = 0.3
      }
    }
    Retract {
      AUDIO
      {
        channel = Ship
        clip = ReStock/Sounds/scanner-close
        volume = 0.3
      }
    }
  }

  MODULE
  {
    name = ModulePartVariants
    baseVariant = Size0

    VARIANT
    {
      name = Size0
      displayName = #LOC_Restock_variant-antenna_size0
      themeName = White
      primaryColor = #C8C8C8
      secondaryColor = #707070
      GAMEOBJECTS
      {
        Body_Rad = false
        Body_625 = true
        Body_125 = false
      }
    }

    VARIANT
    {
      name = Size1
      displayName = #LOC_Restock_variant-antenna_size1
      themeName = White
      primaryColor = #C8C8C8
      secondaryColor = #707070
      GAMEOBJECTS
      {
        Body_Rad = false
        Body_625 = false
        Body_125 = true
      }
    }

    VARIANT
    {
      name = Compact
      displayName = #LOC_Restock_variant-antenna_compact
      themeName = White
      primaryColor = #C8C8C8
      secondaryColor = #999999
      GAMEOBJECTS
      {
        Body_Rad = true
        Body_625 = false
        Body_125 = false
      }
    }
  }
}
// Convert-O-Tron 0625

@PART[MiniISRU06]:HAS[~RestockIgnore[*]]:FOR[ReStock]:NEEDS[ReStock]
{
  @author = Andrew Cassidy

  !MODEL {}
  MODEL
  {
    model = ReStock/Assets/Resource/restock-isru-125-1
    scale = 1.0, 1.0, 1.0
  }

  MODULE
  {
    name = ModuleRestockISRUAnimation
    deployAnimationName = heater
    needsEC = true
  }

  MODULE
  {
    name = ModuleRestockHeatEffects
    enableHeatEmissive = true
    useCoreTemp = true
    shaderProperty = _EmissiveColor
    excludedRenderer = ISRU-125_heater
    lerpMax = 2700
    redCurve
    {
      key = 0 0 2 2
      key = 1 1 0 0
    }
    greenCurve
    {
      key = 0 0 1 1
      key = 1 1 1 1
    }
    blueCurve
    {
      key = 0 0 1 1
      key = 1 1 1 1
    }
    alphaCurve
    {
      key = 0 1 0 0
      key = 1 1 0 0
    }
    disableBlackbody = true
  }
}

