@PART[RAPIERc8,RAPIERc6,RAPIERc9]:NEEDS[ReStock]:AFTER[ReStock]
{
  !EFFECTS {}
}
@PART[RAPIERc8]:NEEDS[zRealPlume,SmokeScreen,ReStock] // CR-7 R.A.P.I.E.R. Engine
{
    PLUME
    {
        name = Turbojet
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,-0.4
        fixedScale = 0.8
        energy = 0.83
        speed = 1
        emissionMult = 1.0
    }
    PLUME
    {
        name = Hypergolic-Lower
        transformName = thrustTransform
        localRotation = 0,0,0
        plumePosition = 0,0,0
        flarePosition = 0,0,0.3
        plumeScale = 0.6
        flareScale = 0.44
        energy = 1
        speed = 1
        emissionMult = 1.0
    }
    @MODULE[ModuleEngines*],0
    {
        %powerEffectName = Turbojet
        %spoolEffectName = Turbojet-Spool
    }
    @MODULE[ModuleEngines*],1
    {
        %powerEffectName = Hypergolic-Lower
    }
}

