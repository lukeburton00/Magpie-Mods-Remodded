@PART[Wolfcub]:NEEDS[ReStock]:AFTER[ReStock]
{
  !EFFECTS {}
}
@PART[Wolfcub]:NEEDS[zRealPlume,SmokeScreen,ReStock]// RE-J10 'Wolfhound'  Liquid Fuel Engine
{
    @MODULE[ModuleEngines*]
    {
      @name = ModuleEnginesFX
      %powerEffectName = Hypergolic_UpperWhite
      !runningEffectName = DELETE
    }

    PLUME
    {
    name = Hypergolic_UpperWhite
    transformName = thrustTransform
    localRotation = 0,0,0
    localPosition = 0,0,0
    energy = 1
    speed = 1
    emissionMult = 0.5

    flareScale = 0.4

    corePosition = 0,0,0
    coreScale = 1.5

    plumePosition = 0,0,0
    plumeScale = 0.8
    }
}
