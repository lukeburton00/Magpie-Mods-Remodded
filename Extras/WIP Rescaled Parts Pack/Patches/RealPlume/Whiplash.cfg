@PART[turboFanEngineTiny]:FOR[RealPlume]:NEEDS[SmokeScreen] // J-X4 "Whiplash" Turbo Ramjet Engine
{
    PLUME
    {
        name = Turbojet
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,-2
        fixedScale = 1.3
        energy = 1
        speed = 1
    }
    @MODULE[ModuleEngines*]
    {
        %powerEffectName = Turbojet
        %spoolEffectName = Turbojet-Spool
    }
}

