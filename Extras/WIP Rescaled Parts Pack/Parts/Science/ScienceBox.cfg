PART
{
	name = ScienceBoxMk2
	module = Part
	author = RoverDude
	MODEL
	{
		model=Squad/Parts/Science/ScienceBox/ScienceBox
	}
	rescaleFactor = 0.5

	node_attach = 0,0,0.25,0,0,-1,0
	node_stack_top = 0.0, 0.4, 0.0, 0.0, 1.0, 0.0,0
	node_stack_bottom = 0.0, -0.4, 0.0, 0.0, -1.0, 0.0,0

	TechRequired = start
	entryCost = 2200
	cost = 1000
	category = Science
	subcategory = 0
	title =  Experiment Storage Unit mk2
	manufacturer = #autoLOC_501644 //#autoLOC_501644 = Experimental Engineering Group
	description = After discovering that old snack boxes were also really effective at storing mystery goo and data tapes, Kerbal scientists created the Experiment Storage Unit to help Kerbalnauts bring their valuable science back to Kerbin, while avoiding the hazards of reentry, rough landings, and Jeb's piloting skills. Now with built in thermometer & Barometer
	attachRules = 1,1,1,1,0
	mass = 0.05
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 2
	crashTolerance = 15
	breakingForce = 250
	breakingTorque = 250
	bulkheadProfiles = size0
	maxTemp = 2900
	heatConductivity = 0.04
	thermalMassModifier = 5.0 
	emissiveConstant = 0.95
	MODULE
	{
		name = ModuleConductionMultiplier
		modifiedConductionFactor = 0.001
		convectionFluxThreshold = 500
	}	
	tags = #autoLOC_500696 //#autoLOC_500696 = science
	MODULE
	{
		name = ModuleScienceContainer
		
		reviewActionName = #autoLOC_502201 //#autoLOC_502201 = Review Stored Data
		storeActionName = #autoLOC_502202 //#autoLOC_502202 = Store Experiments
		evaOnlyStorage = True // i.e. can nearby regular vessels also do this, or EVA only
		storageRange = 1.3
		canBeTransferredToInVessel = True
		canTransferInVessel = True
		showStatus = True
	}
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = temperatureScan
		experimentActionName = #autoLOC_502067 //#autoLOC_502067 = Log Temperature
		resetActionName = #autoLOC_502064 //#autoLOC_502064 = Delete Data
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = False
		xmitDataScalar = 0.5
		dataIsCollectable = True
		collectActionName = #autoLOC_238018 //#autoLOC_238018 = Take Data
		interactionRange = 1.5
		rerunnable = True
		usageReqMaskInternal = 1
		usageReqMaskExternal = 8
	}
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = barometerScan
		experimentActionName = #autoLOC_502065 //#autoLOC_502065 = Log Pressure Data
		resetActionName = #autoLOC_502064 //#autoLOC_502064 = Delete Data
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = False
		xmitDataScalar = 0.5
		dataIsCollectable = True
		collectActionName = #autoLOC_238018 //#autoLOC_238018 = Take Data
		interactionRange = 1.5
		rerunnable = True
		usageReqMaskInternal = 1
		usageReqMaskExternal = 8
	}
