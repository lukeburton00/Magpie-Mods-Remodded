@PART[mk2FuselageShortLiquid|mk2FuselageShortLFO|mk2FuselageShortMono]:NEEDS[ReStock]
{
	@MODULE[ModuleRestockModifyMaterials]
	{
		@MATERIAL
		{
			@shader = TU/Metallic
			PROPERTY
			{
				name = _Metal
				float = 0.25
			}
			PROPERTY
			{
				name = _Smoothness
				float = 0.70
			}
			PROPERTY
			{
				name = _Detail
				float = 0.75
			}
			PROPERTY
			{
				name = _Shininess
				float = 0.85
			}
		}
	}
}
