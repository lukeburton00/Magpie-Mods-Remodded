@REFLECTION_CONFIG[default]
{
	%enabled = true
}
KSP_MODEL_SHADER
{
	name = FullMetal
	
		model = ATK_Propulsion_Pack/Castor 30/Castor30A
		model = ATK_Propulsion_Pack/Castor4A/Castor4A
		model = ATK_Propulsion_Pack/GEM40SRM/KK_GEM-40_AL
		model = ATK_Propulsion_Pack/GEM40SRM/KK_GEM-40_GL
		model = ATK_Propulsion_Pack/GEM46SRM/GEM-46_air
		model = ATK_Propulsion_Pack/GEM46SRM/GEM-46_ground
		model = ATK_Propulsion_Pack/KK_GEM60/KK_GEM60
		model = ATK_Propulsion_Pack/KK_GEM63/KK_GEM63
		model = ATK_Propulsion_Pack/KK_GEM63/KK_GEM63XL
		model = ATK_Propulsion_Pack/Star 13B/ATK_Star13B
		model = ATK_Propulsion_Pack/Star 15G/ATK_Star15G
		model = ATK_Propulsion_Pack/Star 17A/ATK_Star17A
		model = ATK_Propulsion_Pack/Star 20/ATK_Star20
		model = ATK_Propulsion_Pack/Star 27/ATK_Star27
		model = ATK_Propulsion_Pack/Star 27H/ATK_Star27H
		model = ATK_Propulsion_Pack/Star 3/ATK_Star3
		model = ATK_Propulsion_Pack/Star 30BP/ATK_Star30BP
		model = ATK_Propulsion_Pack/Star 31/ATK_Star31
		model = ATK_Propulsion_Pack/Star 37FM/ATK_Star37FM
		model = ATK_Propulsion_Pack/Star 48B/KK_Star48B
		model = ATK_Propulsion_Pack/Star 4G/ATK_Star4G
		model = ATK_Propulsion_Pack/Star 5C/ATK_Star5C
		model = ATK_Propulsion_Pack/Star 63D/ATK_Star63D
		model = ATK_Propulsion_Pack/Star 6B/ATK_Star6B
		model = ATK_Propulsion_Pack/Star 9/ATK_Star9

		
	MATERIAL
	{
		shader = TU/Metallic
		
		inheritTexture = _MainTex
		inheritTexture = _BumpMap
		inheritTexture = _Emissive

		excludeMesh = flagTransform
		excludeMesh = Flag
		mesh = nozzle
		mesh = Nozzle
		excludeMesh = body
		excludeMesh = Body
		excludeMesh = tank

		PROPERTY
		{
			name = _Metal
			float = 0.70
		}
		PROPERTY
		{
			name = _Smoothness
			float = 0.75
		}
		PROPERTY
		{
			name = _Detail
			float = 0.85
		}
		PROPERTY
		{
			name = _Shininess
			float = 0.80
		}
	}
}
