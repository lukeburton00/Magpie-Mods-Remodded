		model = TokamakIndustries/parts/inflatoflat/model
		model = TokamakIndustries/spaces/centrifuge1internal/model
		model = TokamakIndustries/spaces/centrifugeSmall/centrifugeSmallIVA
		model = TokamakIndustries/spaces/dryworkshop/dryworkshopinternal
		model = TokamakIndustries/spaces/inflato1internal/Inflato1internal
		model = TokamakIndustries/assets/inflato2internal
		model = TokamakIndustries/assets/inflatoflatinternal
		
		
	MATERIAL
	{
