@REFLECTION_CONFIG[default]
{
	%enabled = true
}
KSP_MODEL_SHADER
{
	name = FullMetal
	
		model = TokamakIndustries/assets/dryworkshopexternal
		model = TokamakIndustries/assets/munox-adapter-flat
		model = TokamakIndustries/assets/munox-adapter-parallel
		model = TokamakIndustries/assets/munox-adapter-perpendicular
		model = TokamakIndustries/assets/munox-adapter-stackvert
		model = TokamakIndustries/parts/KADEPT/NASAaeroShield
		model = TokamakIndustries/parts/orbitalorb/model000

		
	MATERIAL
	{
		shader = TU/Metallic
		
		inheritTexture = _MainTex
		inheritTexture = _BumpMap
		inheritTexture = _Emissive

		excludeMesh = flagTransform
		excludeMesh = Flag
		excludeMesh = window
		excludeMesh = sidewindow
		excludeMesh = glass
		excludeMesh = overlay
		excludeMesh = window
		excludeMesh = SideWindow
		excludeMesh = FrontWindow
		excludeMesh = Wheel
		PROPERTY
		{
			name = _Color
			color = 1.4,1.4,1.4
		}
		PROPERTY
		{
			name = _Metal
			float = 0.80
		}
		PROPERTY
		{
			name = _Smoothness
			float = 0.75
		}
		PROPERTY
		{
			name = _Detail
			float = 0.85
		}
	}

}
