@REFLECTION_CONFIG[default]
{
	%enabled = true
}
KSP_MODEL_SHADER
{
	name = FullMetal
	
		model = Mk3HypersonicSystems/Parts/Mk3 Lifting Body Extension/Mk3LiftingBodyEdge
		model = Mk3HypersonicSystems/Parts/Mk3 Radial RAM Intake/Mk3RadialRAMIntake
		model = Mk3HypersonicSystems/Parts/Mk3 Wing Edge Extension/Mk3EdgeRootExtension
		model = Mk3HypersonicSystems/Parts/Mk3Aerospike/Mk3Aerospike
		model = Mk3HypersonicSystems/Parts/mk3HypersonicCockpit/model
		model = Mk3HypersonicSystems/Parts/Mk3HypersonicDroneCore/DroneCore
		model = Mk3HypersonicSystems/Parts/Mk3RamIntake/Mk3RamIntake
		model = Mk3HypersonicSystems/Parts/Mk3Turbofan/Mk3Turbofan
		model = Mk3HypersonicSystems/Parts/Scramjet/Scramjet
		model = Mk3HypersonicSystems/Parts/Tank/fuelTankN5
		model = Mk3HypersonicSystems/Parts/turboramjet2m/turboramjet2m
		model = Mk3HypersonicSystems/Parts/TwoFiveMShock Cone/shockConeTwoM
		model = Mk3HypersonicSystems/Props/Propjstck/Propjstck
		model = Mk3HypersonicSystems/Props/Proppanel/Proppanel
		model = Mk3HypersonicSystems/Props/Propseat/Propseat
		model = Mk3HypersonicSystems/Spaces/Cockpit/Mk3_Hypersonic_IVA
		
	MATERIAL
	{
		shader = TU/Metallic
		
		inheritTexture = _MainTex
		inheritTexture = _BumpMap
		inheritTexture = _Emissive

		excludeMesh = flagTransform
		excludeMesh = Flag
		excludeMesh = window
		excludeMesh = sidewindow
		excludeMesh = glass
		excludeMesh = overlay
		excludeMesh = window
		excludeMesh = SideWindow
		excludeMesh = FrontWindow
		excludeMesh = Wheel


		PROPERTY
		{
			name = _Metal
			float = 0.35
		}
		PROPERTY
		{
			name = _Smoothness
			float = 0.70
		}
		PROPERTY
		{
			name = _Detail
			float = 0.85
		}
		PROPERTY
		{
			name = _Shininess
			float = 0.85
		}
	}

}
