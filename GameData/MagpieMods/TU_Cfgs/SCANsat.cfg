@REFLECTION_CONFIG[default]
{
	%enabled = true
}
KSP_MODEL_SHADER
{
	name = FullMetal
	
		model = SCANsat/Parts/BTDT/BTDT
		model = SCANsat/Parts/MapTraq/MapTraq
		model = SCANsat/Parts/MULTI/MULTI
		model = SCANsat/Parts/RADAR/RADAR
		model = SCANsat/Parts/SAR/SAR
		model = SCANsat/Parts/scansat-btdt/scansat-exomars-1
		model = SCANsat/Parts/scansat-multi/scansat-multi-abi-1
		model = SCANsat/Parts/scansat-multi/scansat-multi-modis-1
		model = SCANsat/Parts/scansat-multi/scansat-multi-msi-1
		model = SCANsat/Parts/scansat-radar/scansat-radar-poseidon-3b-1
		model = SCANsat/Parts/scansat-radar/scansat-radar-seasat-1
		model = SCANsat/Parts/scansat-recon/scansat-recon-ikonos-1
		model = SCANsat/Parts/scansat-recon/scansat-recon-kh11-1
		model = SCANsat/Parts/scansat-recon/scansat-recon-worldview-3-1
		model = SCANsat/Parts/scansat-resources/scansat-resources-crism-1
		model = SCANsat/Parts/scansat-resources/scansat-resources-hyperion-1
		model = SCANsat/Parts/scansat-resources/scansat-resources-mise-1
		model = SCANsat/Parts/scansat-sar/scansat-sar-paz-1
		model = SCANsat/Parts/scansat-sar/scansat-sar-radarsat-2-1
		model = SCANsat/Parts/scansat-sar/scansat-sar-skymed-1
		model = SCANsat/Parts/scansat-sar/scansat-sar-tandem-l-1
		
	MATERIAL
	{
		shader = TU/Metallic
		
		inheritTexture = _MainTex
		inheritTexture = _BumpMap
		inheritTexture = _Emissive

		excludeMesh = flagTransform
		excludeMesh = Flag
		excludeMesh = ABIFoil
		excludeMesh = ABIFoil_Silver
		excludeMesh = MODIS_Foil
		excludeMesh = MODIS_Foil_Silver
		excludeMesh = MSI_Foil
		excludeMesh = MSI_Foil_Silver

		PROPERTY
		{
			name = _Color
			color = 1.6,1.6,1.6
		}
		PROPERTY
		{
			name = _Metal
			float = 0.85
		}
		PROPERTY
		{
			name = _Smoothness
			float = 0.75
		}
		PROPERTY
		{
			name = _Detail
			float = 0.85
		}
		PROPERTY
		{
			name = _Shininess
			float = 0.85
		}
	}

}
KSP_MODEL_SHADER
{
	name = LessMetal
		
		
		
	MATERIAL
	{
		shader = TU/Metallic
		
		inheritTexture = _MainTex
		inheritTexture = _BumpMap
		inheritTexture = _Emissive

		excludeMesh = flagTransform
		excludeMesh = Flag
		excludeMesh = Wheel
		excludeMesh = window
		excludeMesh = sidewindow
		excludeMesh = glass
		excludeMesh = overlay
		excludeMesh = window
		excludeMesh = SideWindow
		excludeMesh = FrontWindow
		excludeMesh = Window
		excludeMesh = Window2
		excludeMesh = Glass1
		excludeMesh = Glass2



		PROPERTY
		{
			name = _Metal
			float = 0.35
		}
		PROPERTY
		{
			name = _Smoothness
			float = 0.70
		}
		PROPERTY
		{
			name = _Detail
			float = 0.75
		}
		PROPERTY
		{
			name = _Shininess
			float = 0.85
		}
	}
}


KSP_MODEL_SHADER
{
	name = NoMetal
	MATERIAL 
	{
		shader = TU/Metallic		
		inheritTexture = _MainTex
		inheritTexture = _BumpMap
		inheritTexture = _Emissive
		excludeMesh = flagTransform
		excludeMesh = FLAG
		PROPERTY
		{
			name = _Metal
			float = 0.0
		}
	}
}
